name: Build CAPL-6000 OpenWrt

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses5-dev libssl-dev python3 \
            python3-distutils rsync unzip zlib1g-dev file wget

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure CAPL-6000
        run: |
          echo 'CONFIG_TARGET_ath79=y' > .config
          echo 'CONFIG_TARGET_ath79_generic=y' >> .config
          echo 'CONFIG_TARGET_ath79_generic_DEVICE_hanbit_capl-6000=y' >> .config
          make defconfig

      - name: Build firmware
        run: |
          make -j2 V=s

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: CAPL-6000-firmware
          path: |
            bin/targets/ath79/generic/*capl-6000*.bin
