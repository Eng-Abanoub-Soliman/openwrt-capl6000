name: Build CAPL-6000 OpenWrt

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # Cache downloaded OpenWrt source packages
      - name: Cache OpenWrt downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: capl6000-dl-${{ runner.os }}-${{ hashFiles('**/Makefile', 'feeds.conf.default') }}
          restore-keys: |
            capl6000-dl-${{ runner.os }}-

      # Cache compiler output
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: capl6000-ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            capl6000-ccache-${{ runner.os }}-

      - name: Build inside Ubuntu 18.04
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            ubuntu:18.04 \
            bash -c '
              set -e

              export FORCE_UNSAFE_CONFIGURE=1
              export CCACHE_DIR=/work/.ccache
              export CCACHE_BASEDIR=/work

              echo "=== Installing build dependencies ==="

              apt-get update

              DEBIAN_FRONTEND=noninteractive apt-get install -y \
                build-essential \
                gcc \
                g++ \
                gcc-multilib \
                g++-multilib \
                flex \
                bison \
                gawk \
                gettext \
                git \
                libncurses5-dev \
                libncursesw5-dev \
                libssl-dev \
                python \
                python2.7 \
                python2.7-dev \
                python3 \
                python3-distutils \
                rsync \
                unzip \
                zlib1g-dev \
                file \
                wget \
                subversion \
                swig \
                time \
                xsltproc \
                ca-certificates \
                ccache

              echo "=== Versions ==="
              gcc --version
              g++ --version
              python --version
              ccache --version

              echo "=== Update feeds ==="
              ./scripts/feeds update -a
              ./scripts/feeds install -a

              echo "=== Configure CAPL-6000 ==="

              rm -f .config

              echo "CONFIG_TARGET_ath79=y" >> .config
              echo "CONFIG_TARGET_ath79_generic=y" >> .config
              echo "CONFIG_TARGET_ath79_generic_DEVICE_hanbit_capl-6000=y" >> .config
              echo "CONFIG_CCACHE=y" >> .config

              make defconfig

              echo "=== CHECK CONFIG ==="
              grep -E "CAPL|capl|CCACHE|TARGET_ath79" .config || true

              echo "=== BUILD START ==="

              make -j2 V=s

              echo "=== BUILD FINISHED ==="

              ccache -s || true
            '

      - name: Show generated files
        if: always()
        run: |
          echo "=== Generated BIN files ==="
          find bin/targets -type f -name "*.bin" -print 2>/dev/null || true

      - name: Upload CAPL-6000 firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CAPL-6000-firmware
          path: |
            bin/targets/ath79/generic/*capl-6000*.bin
          if-no-files-found: error
