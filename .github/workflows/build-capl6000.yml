name: Build CAPL-6000 OpenWrt

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build inside Ubuntu 18.04
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            ubuntu:18.04 \
            bash -c '
              set -e

              apt-get update

              DEBIAN_FRONTEND=noninteractive apt-get install -y \
                build-essential \
                gcc \
                g++ \
                gcc-multilib \
                g++-multilib \
                flex \
                bison \
                gawk \
                gettext \
                git \
                libncurses5-dev \
                libncursesw5-dev \
                libssl-dev \
                python \
                python2.7 \
                python2.7-dev \
                python3 \
                python3-distutils \
                rsync \
                unzip \
                zlib1g-dev \
                file \
                wget \
                subversion \
                swig \
                time \
                xsltproc \
                ca-certificates

              gcc --version
              g++ --version
              python --version

              ./scripts/feeds update -a
              ./scripts/feeds install -a

              echo "CONFIG_TARGET_ath79=y" > .config
              echo "CONFIG_TARGET_ath79_generic=y" >> .config
              echo "CONFIG_TARGET_ath79_generic_DEVICE_hanbit_capl-6000=y" >> .config

              make defconfig

              make -j1 V=sc
            '

      - name: Show generated files
        run: |
          find bin/targets -type f -name "*.bin" -print || true

      - name: Upload CAPL-6000 firmware
        uses: actions/upload-artifact@v4
        with:
          name: CAPL-6000-firmware
          path: |
            bin/targets/ath79/generic/*capl-6000*.bin
